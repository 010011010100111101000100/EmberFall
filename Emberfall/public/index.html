<script>

const $=i=>document.getElementById(i),cv=$('c'),gl=cv.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'})||cv.getContext('webgl',{antialias:true,alpha:false});
const GL2=typeof WebGL2RenderingContext!='undefined'&&gl instanceof WebGL2RenderingContext;
// ================= SHADERS =================
const VS=`attribute vec3 p,n,cl;uniform mat4 vp;uniform vec3 off,sc;uniform float a;varying vec3 vn,vc,wp;varying float fog;
void main(){float s=sin(a),c=cos(a);vec3 q=p*sc;q=vec3(q.x*c+q.z*s,q.y,-q.x*s+q.z*c)+off;vec3 m=n/sc;vn=vec3(m.x*c+m.z*s,m.y,-m.x*s+m.z*c);vc=cl;wp=q;vec4 r=vp*vec4(q,1.);gl_Position=r;fog=clamp((r.w-70.)/190.,0.,1.);gl_PointSize=2.5;}`;
const FS=`precision highp float;varying vec3 vn,vc,wp;varying float fog;uniform vec3 col,sunD,sunC,ambC,fogC,skyT,skyH,cam;uniform float mode,em,al,tm,night,det;
float hs(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float ns(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hs(i),hs(i+vec2(1.,0.)),f.x),mix(hs(i+vec2(0.,1.)),hs(i+vec2(1.,1.)),f.x),f.y);}
void main(){vec3 N=normalize(vn);
if(mode>3.5&&mode<4.5){float y=clamp(N.y,0.,1.);vec3 c=mix(skyH,skyT,pow(y,.45));float s=max(dot(N,sunD),0.);c+=sunC*(pow(s,40.)*.6+pow(s,800.)*6.+pow(s,6.)*.12);
 if(N.y>.02){vec2 p=N.xz/(N.y+.2)*1.8+vec2(tm*.012,tm*.004);float cl=ns(p)*.55+ns(p*2.3)*.3+ns(p*5.1)*.15;cl=smoothstep(.5,.85,cl);vec3 cc=mix(skyH,sunC,.45)*.95+vec3(.08);float under=ns(p*1.7+3.)*.25;c=mix(c,cc*(.42+.58*(1.-night))*(1.-under*.5),cl*.8*smoothstep(.02,.3,N.y));}
 gl_FragColor=vec4(c,1.);return;}
if(mode>4.5&&mode<5.5){gl_FragColor=vec4(col,al);return;}
vec3 V=normalize(cam-wp);
if(mode>5.5){vec2 p=wp.xz*.07;float w=ns(p+vec2(tm*.1,0.))*.6+ns(p*2.7-vec2(0.,tm*.17))*.4;vec3 base=mix(vec3(.04,.14,.28),vec3(.16,.44,.6),w);
 vec3 wn=normalize(vec3((ns(wp.xz*.55+tm*.3)-.5)*.55,1.,(ns(wp.xz*.55-tm*.25+9.)-.5)*.55));float fr=pow(1.-clamp(dot(V,wn),0.,1.),3.);vec3 R=reflect(-V,wn);
 vec3 c=base*(ambC*1.4+sunC*.5);c=mix(c,skyH*1.05+skyT*.25,clamp(fr*.85+.1,0.,1.));c+=sunC*pow(max(dot(R,sunD),0.),160.)*5.;c+=sunC*pow(ns(wp.xz*.9+tm*.6),9.)*1.4;
 float f=fog*fog*(3.-2.*fog);gl_FragColor=vec4(mix(c,fogC,f),.78);return;}
if(mode>2.5){gl_FragColor=vec4(col*vc,al);return;}
float ndl=dot(N,sunD),d=max(ndl,0.);vec3 b=col*vc;
if(det>.5){float n1=ns(wp.xz*.3),n2=ns(wp.xz*1.7),n3=ns(wp.xz*6.3);float pn=ns(wp.xz*.045+7.),bl0=1.-smoothstep(.5,.78,dot(b,vec3(.33)));b=mix(b,mix(b*vec3(.8,.92,.78),b*vec3(1.2,1.08,.7),pn),bl0);b*=.74+.26*n1+.18*(n2-.5)+.12*(n3-.5);float lum=dot(b,vec3(.33)),sl=1.-N.y;b=mix(b,vec3(lum)*vec3(1.06,1.,.94),smoothstep(.2,.5,sl)*.55);}
vec3 hemi=ambC*(.68+.32*N.y)+fogC*.1*(1.-N.y);
vec3 c=b*(hemi+sunC*d)+b*sunC*max((ndl+.3)/1.3-d,0.)*.22;
float fr=pow(1.-max(dot(N,V),0.),3.);vec3 H=normalize(sunD+V);
c+=mix(fogC,sunC,.35)*fr*.1*(.3+d)+sunC*pow(max(dot(N,H),0.),28.)*d*(.05+em*.12);
c+=b*em*(1.+pow(1.-abs(N.z),2.)*.5)+col*em*fr*.45;
vec3 fc=fogC+sunC*pow(max(dot(-V,sunD),0.),5.)*.2;float f=fog*fog*(3.-2.*fog);
gl_FragColor=vec4(mix(c,fc,f),1.);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
let AL=1,DET=0;const U={};['vp','off','sc','a','mode','col','em','al','tm','night','sunD','sunC','ambC','fogC','skyT','skyH','cam','det'].forEach(n=>U[n]=gl.getUniformLocation(pr,n));
const AT=['p','n','cl'].map(n=>gl.getAttribLocation(pr,n));AT.forEach(l=>gl.enableVertexAttribArray(l));
function mk(g){const o={n:g.P.length/3,b:[]};[g.P,g.N,g.C||g.P.map(()=>1)].forEach(a=>{const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(a),gl.STATIC_DRAW);o.b.push(b)});return o}
function dr(o,x,y,z,a,s,col,em,mode,prim){const S=typeof s=='number'?[s,s,s]:s;gl.uniform3f(U.off,x,y,z);gl.uniform1f(U.a,a||0);gl.uniform3f(U.sc,S[0],S[1],S[2]);gl.uniform3fv(U.col,col);gl.uniform1f(U.em,em||0);gl.uniform1f(U.mode,mode||0);gl.uniform1f(U.al,AL);gl.uniform1f(U.det,DET);
 for(let i=0;i<3;i++){gl.bindBuffer(gl.ARRAY_BUFFER,o.b[i]);gl.vertexAttribPointer(AT[i],3,gl.FLOAT,false,0,0)}gl.drawArrays(prim||gl.TRIANGLES,0,o.n)}
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],nrm=a=>{const l=Math.hypot(...a)||1;return a.map(q=>q/l)},dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
// raw geometry
function tri(P,N,a,b,c){const n=nrm(cross(sub(b,a),sub(c,a)));P.push(...a,...b,...c);N.push(...n,...n,...n)}
function rGem(top,bot,w,sd){const P=[],N=[],R=[];for(let i=0;i<sd;i++){const an=i/sd*6.2832;R.push([Math.cos(an)*w,0,Math.sin(an)*w])}for(let i=0;i<sd;i++){const a=R[i],b=R[(i+1)%sd];tri(P,N,[0,top,0],b,a);tri(P,N,[0,-bot,0],a,b)}return{P,N}}
function rCone(h,r,sd){const P=[],N=[],R=[];for(let i=0;i<sd;i++){const an=i/sd*6.2832;R.push([Math.cos(an)*r,0,Math.sin(an)*r])}for(let i=0;i<sd;i++)tri(P,N,[0,h,0],R[(i+1)%sd],R[i]);return{P,N}}
function rBox(w,h,d){const x=w/2,z=d/2,P=[],N=[],f=(a,b,c,e,n)=>{[a,b,c,a,c,e].forEach(v=>{P.push(...v);N.push(...n)})};
